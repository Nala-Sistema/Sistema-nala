# Sinais do Dia v1.3 "Aparece desde": grava os sinais do dia em sinal_historico.
#
# Repo PÚBLICO: os logs deste workflow são públicos. O script só imprime
# contagens (nunca SKU, R$, loja ou mensagem de erro do banco) e a conexão vem
# do secret SINAIS_HIST_DB_URL (usuário sinais_historico, permissão mínima).
# Dispara SÓ por agenda e à mão — nunca por pull request (PR de fork não pode
# rodar com o secret).
#
# 15:00 UTC = 12h de Brasília. O GitHub atrasa a agenda em até ~5h: mesmo
# atrasado roda no mesmo dia de Brasília. O script não grava antes das 10h.

name: Sinais do Dia - historico diario

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinais-historico
  cancel-in-progress: false

jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fixadas por SHA do commit (não por tag, que pode ser movida)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Dependências (só o que a montagem dos sinais usa)
        run: pip install --quiet --disable-pip-version-check pandas==2.3.3 psycopg2-binary==2.9.12

      - name: Gravar os sinais do dia
        env:
          SINAIS_HIST_DB_URL: ${{ secrets.SINAIS_HIST_DB_URL }}
        run: python jobs/historico_sinais.py
